name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system ping (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iputils-ping
      - name: Install package and test dependency
        run: python -m pip install ".[test]"
      - name: Run unit and real loopback tests
        run: python -m pytest
      - name: Exercise installed CLI
        run: network-monitor 127.0.0.1 --count 3 --interval 0.1 --timeout 1 --no-animation
