[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-performance-monitor"
version = "1.0.0"
description = "Real ICMP latency and packet-loss monitoring with a responsive Rich terminal dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "raafen"}]
dependencies = ["rich>=13.7,<15"]
keywords = ["icmp", "ping", "latency", "network", "terminal", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
network-monitor = "network_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/raafen/network-performance-monitor"
Issues = "https://github.com/raafen/network-performance-monitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: executes the operating system ping utility against loopback"]
